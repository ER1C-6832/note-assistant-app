[project]
name = "note-assistant"
version = "0.1.0"
description = "A local-first note-taking desktop application powered by PySide6 and QML"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Note Assistant Team" },
]

dependencies = [
    "PySide6>=6.6",
    "qasync>=0.27,<1",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "black>=24.0",
    "ruff>=0.3",
]

# 当前仓库是桌面应用源码布局，不需要把 pc-app-build 根目录
# 自动发现成可导入 Python 包。main.py 会显式加入应用目录。
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.ruff]
target-version = "py310"
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"