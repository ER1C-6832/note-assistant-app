[project]
name = "note-assistant"
version = "0.1.0"
description = "A local-first note-taking desktop application powered by PySide6 and QML"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Note Assistant Team" },
]
dependencies = [
    "PySide6>=6.6",
    "qasync>=0.27,<1",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "websockets>=16.0,<17",
    "PyAudio>=0.2.14,<0.3",
    "av>=13,<17",
]

[project.optional-dependencies]
kws = [
    "numpy>=1.26,<3",
    "sherpa-onnx>=1.12,<2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "black>=24.0",
    "ruff>=0.3",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.ruff]
target-version = "py310"
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
